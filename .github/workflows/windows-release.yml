name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --onefile --name PDFTools main.py
      - name: Package portable archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/PDFTools.exe release/
          Copy-Item README.md release/README.txt
          Compress-Archive -Path release/* -DestinationPath PDFTools_2.0_Portable_Windows_x64.zip
      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/PDFTools.exe -Algorithm SHA256).Hash.ToLower()
          "PDFTools.exe  $hash" | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PDFTools.exe
            PDFTools_2.0_Portable_Windows_x64.zip
            SHA256SUMS.txt
