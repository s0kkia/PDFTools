[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftools"
version = "2.0.3"
description = "PDFTools test-1 — Windows PDF toolkit"
requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6>=6.7,<7", "PyMuPDF>=1.24", "pikepdf>=9.0",
  "pypdf>=5.0", "Pillow>=10.0", "reportlab>=4.0", "pytesseract>=0.3.10"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
